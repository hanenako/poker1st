services:
  db:
    image: postgres:17-alpine
    container_name: poker1st-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker_dev
      POSTGRES_DB: poker1st
      TZ: Asia/Tokyo
    ports:
      - "15432:5432"
    volumes:
      - poker_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker1st"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  poker_pg_data:
